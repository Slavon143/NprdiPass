name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: nordipass_testing
  DB_USERNAME: root
  DB_PASSWORD: root

jobs:
  backend:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nordipass_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: public/build

      - name: Set isolated catalogue media directory
        run: echo "CATALOG_MEDIA_ROOT=$RUNNER_TEMP/catalog-media-testing" >> "$GITHUB_ENV"

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, fileinfo, zip, xmlreader, xmlwriter
          tools: composer:v2

      - name: Verify release tooling and lifecycle failures
        run: |
          export SITE_TEST_PHP="$(command -v php)"
          python3 -m unittest discover -s tests/Release -v

      - name: Validate composer
        run: composer validate --strict

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate --force

      - name: Run database migrations
        run: php artisan migrate:fresh --seed --force --env=testing
        env:
          APP_ENV: testing

      - name: Run full application MySQL tests
        run: php artisan test
        env:
          APP_ENV: testing

      - name: Run static analysis
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Run code style check
        run: ./vendor/bin/pint --test

      - name: Run composer audit
        run: composer audit --locked

      - name: Cache routes and config
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

      - name: Verify routes and schedule
        run: |
          php artisan route:list
          php artisan schedule:list

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend regressions
        run: node --test tests/Js/*.test.mjs

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 1
