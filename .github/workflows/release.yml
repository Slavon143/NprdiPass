name: Release Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, fileinfo, zip, xmlreader, xmlwriter
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --classmap-authoritative

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Verify release tooling
        run: python3 -m unittest discover -s tests/Release -v

      - name: Create release artifact
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          python3 deploy/scripts/release_artifact.py build \
            --source . --artifact nordipass-release.tar.gz \
            --commit "$RELEASE_COMMIT" --ref "$RELEASE_REF" \
            --php-version "$(php -r 'echo PHP_VERSION;')" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nordipass-release
          path: |
            nordipass-release.tar.gz
            nordipass-release.tar.gz.sha256
          retention-days: 7

      - name: Verify artifact
        run: |
          python3 deploy/scripts/release_artifact.py verify --artifact nordipass-release.tar.gz --checksum-file nordipass-release.tar.gz.sha256
